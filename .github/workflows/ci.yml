name: Validate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests
      - run: python -m pip_audit -r requirements-lock.txt --no-deps --disable-pip
      - name: Python security (medium and high)
        run: python -m bandit -q -r . -x './.venv,./.audit-venv,./ui,./build,./dist,./release,./release-audit,./Build Final,./tests,./backups' -ll
      - run: npm ci
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: ui
      - name: Development advisories (documented unpatched braces)
        run: npm audit
        working-directory: ui
        continue-on-error: true
      - run: npm run build
        working-directory: ui
